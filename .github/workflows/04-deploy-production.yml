name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  deploy-production:
    name: Blue-Green Deploy to Production
    runs-on: ubuntu-latest

    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      # -------------------------------------------------------------
      # Resolve which image version is being released (Green)
      # and which version is the current production fallback (Blue).
      # -------------------------------------------------------------
      - name: Determine image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          else
            IMAGE_TAG="${{ inputs.image_tag }}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Releasing image tag: $IMAGE_TAG"

      - name: Capture current Blue (rollback) image tag
        run: |
          CURRENT=$(kubectl get deployment frontend-blue \
            -n production \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          BLUE_TAG="${CURRENT##*:}"
          if [ -z "$BLUE_TAG" ] || [ "$BLUE_TAG" = "placeholder" ]; then
            BLUE_TAG="$IMAGE_TAG"
            echo "No valid Blue deployment found; using new tag as Blue baseline."
          else
            echo "Existing Blue (production) tag: $BLUE_TAG"
          fi
          echo "BLUE_TAG=$BLUE_TAG" >> "$GITHUB_ENV"

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply database manifests (shared by Blue and Green)
        run: |
          kubectl apply \
            -f kubernetes/production/01-namespace.yaml \
            -f kubernetes/production/02-user-db.yaml \
            -f kubernetes/production/03-student-db.yaml \
            -f kubernetes/production/04-lecturer-db.yaml \
            -f kubernetes/production/05-course-db.yaml \
            -f kubernetes/production/06-enrollment-db.yaml

      - name: Apply application manifests (Blue + Green + Services)
        run: |
          kubectl apply \
            -f kubernetes/production/07-user-service.yaml \
            -f kubernetes/production/08-student-service.yaml \
            -f kubernetes/production/09-lecturer-service.yaml \
            -f kubernetes/production/10-course-service.yaml \
            -f kubernetes/production/11-enrollment-service.yaml \
            -f kubernetes/production/12-frontend.yaml
      - name: Set Blue and Green images
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          set -e
          for entry in frontend:koalatech-frontend user-service:koalatech-user-service student-service:koalatech-student-service lecturer-service:koalatech-lecturer-service course-service:koalatech-course-service enrollment-service:koalatech-enrollment-service; do
            svc="${entry%%:*}"
            img="${entry##*:}"
            kubectl set image deployment/${svc}-green -n production \
              ${svc}=${ACR}/${img}:${IMAGE_TAG}
            kubectl set image deployment/${svc}-blue -n production \
              ${svc}=${ACR}/${img}:${BLUE_TAG}
          done

      - name: Wait for Blue rollout (ensure fallback is ready)
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl rollout status deployment/${svc}-blue -n production --timeout=300s
          done

      - name: Deploy Green - wait for rollout
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl rollout status deployment/${svc}-green -n production --timeout=300s
          done
      - name: Validate Green (application-level health check)
        run: |
          set -e
          local_port=18080
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            if [ "$svc" = "frontend" ]; then
              remote_port=80
              path="/"
            else
              remote_port=8000
              path="/health"
            fi
            echo "Health checking Green ${svc} -> localhost:${local_port}${path}"
            kubectl port-forward deployment/${svc}-green -n production ${local_port}:${remote_port} >/tmp/port-forward.log 2>&1 &
            PF_PID=$!
            sleep 5
            curl --fail --silent --retry 5 --retry-delay 2 \
              "http://localhost:${local_port}${path}" || {
                echo "::error::Green ${svc} failed health check"
                kill $PF_PID 2>/dev/null || true
                exit 1
              }
            kill $PF_PID 2>/dev/null || true
            wait $PF_PID 2>/dev/null || true
            local_port=$((local_port + 1))
          done
          echo "All Green services passed health checks."
      - name: Switch production traffic to Green
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service ${svc} -n production \
              -p '{"spec":{"selector":{"version":"green"}}}'
          done
          echo "Traffic switched to Green."

      - name: Monitor Green and rollback on failure
        run: |
          set -e
          FRONTEND_IP=""
          for i in {1..30}; do
            FRONTEND_IP=$(kubectl get service frontend -n production \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$FRONTEND_IP" ] && break
            sleep 10
          done
          if [ -z "$FRONTEND_IP" ]; then
            echo "::error::Unable to determine frontend IP for monitoring."
            exit 1
          fi

          echo "Monitoring Green at http://${FRONTEND_IP}"
          FAILURES=0
          for i in {1..6}; do
            if curl --fail --silent --max-time 10 "http://${FRONTEND_IP}/" >/dev/null; then
              echo "Monitor check ${i}/6: healthy"
            else
              echo "Monitor check ${i}/6: FAILED"
              FAILURES=$((FAILURES + 1))
            fi
            sleep 10
          done

          if [ "$FAILURES" -ge 3 ]; then
            echo "::error::Green failed post-deployment monitoring. Rolling back to Blue."
            for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
              kubectl patch service ${svc} -n production \
                -p '{"spec":{"selector":{"version":"blue"}}}'
            done
            for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
              kubectl rollout status deployment/${svc}-blue -n production --timeout=120s
            done
            echo "Rolled back to Blue."
            exit 1
          fi

          echo "Green remained healthy. Keeping Green in production."
      - name: Promote Green to Blue baseline
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          for entry in frontend:koalatech-frontend user-service:koalatech-user-service student-service:koalatech-student-service lecturer-service:koalatech-lecturer-service course-service:koalatech-course-service enrollment-service:koalatech-enrollment-service; do
            svc="${entry%%:*}"
            img="${entry##*:}"
            kubectl set image deployment/${svc}-blue -n production \
              ${svc}=${ACR}/${img}:${IMAGE_TAG}
          done
          echo "Blue baseline updated to the new production version."

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

      - name: Trigger monitoring deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 05-deploy-monitoring.yml --ref main
