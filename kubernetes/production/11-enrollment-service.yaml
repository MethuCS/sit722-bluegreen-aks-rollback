apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-service-blue
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrollment-service
      version: blue
  template:
    metadata:
      labels:
        app: enrollment-service
        version: blue
    spec:
      containers:
        - name: enrollment-service
          image: placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: enrollments

            - name: POSTGRES_HOST
              value: enrollment-db

            - name: POSTGRES_PORT
              value: "5432"

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: JWT_SECRET_KEY

            - name: JWT_ALGORITHM
              value: HS256

---
